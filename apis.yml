aid: unravel-data-systems
name: Unravel Data Systems
description: >-
  Unravel Data Systems is an AI-powered data observability and FinOps platform
  that helps data teams optimize performance, cost, and reliability across
  modern data stacks including Databricks, Snowflake, BigQuery, Amazon EMR, and
  Cloudera. The self-hosted and SaaS platform exposes a REST API (JSON over
  HTTP, session-token authentication via /signIn, RBAC-scoped) for querying
  application performance, cluster operations, chargeback, anomaly detection,
  and pipeline data collected by its observability engine.
