apis:
- aid: unravel-data-systems:unravel-rest-api
  name: Unravel REST API
  description: >-
    REST API for the Unravel data observability platform. Query and collect
    data from your monitored clusters and workspaces over HTTP/HTTPS with JSON
    requests and responses. Endpoint groups cover applications (summaries,
    recommendations, errors, logs), apps search and events, on-demand reports,
    queue analysis, chargeback, operations (cluster nodes and resource
    allocation), anomaly detection, and pipelines. Authentication is via a
    session token returned by POST /signIn; access level is determined by the
    caller's RBAC role. The API is served by each Unravel deployment (default
    base https://unravel-host:3000/api/v1) rather than a shared public cloud
    host.
  humanURL: http://unravel-docs.unraveldata.com/unravel-v4823x/en/on-prem-apis.html
  baseURL: https://unravel-host:3000/api/v1
